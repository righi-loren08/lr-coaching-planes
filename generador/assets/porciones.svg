<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" role="img" aria-labelledby="t d">
  <title id="t">Cómo medir las porciones con tu mano</title>
  <desc id="d">Palma para proteínas, puño para verduras, mano ahuecada para carbohidratos y pulgar para grasas.</desc>
  <style>
    .bg{fill:#0c0c0b}.card{fill:#171614;stroke:#2c2925;stroke-width:2}
    .h{fill:#f2ede6;font:400 30px 'Anton','Arial Narrow',sans-serif;letter-spacing:1px}
    .t{fill:#f2ede6;font:700 24px 'Archivo','Arial',sans-serif}
    .s{fill:#9b9288;font:400 18px 'Archivo','Arial',sans-serif}
    .k{fill:#ff4b1f;font:700 14px 'JetBrains Mono',monospace;letter-spacing:2px}
    .fig{fill:#ff4b1f}.ln{stroke:#0c0c0b;stroke-width:3;fill:none;stroke-linecap:round}
  </style>
  <rect class="bg" width="640" height="700"/>
  <text class="h" x="32" y="52">MEDÍ CON TU MANO</text>
  <text class="s" x="32" y="80">Tu mano siempre va con vos y se ajusta a tu tamaño.</text>

  <!-- Palma -->
  <rect class="card" x="32" y="104" width="280" height="240" rx="14"/>
  <g transform="translate(172,208) scale(.85)">
    <rect class="fig" x="-48" y="0" width="96" height="86" rx="20"/>
    <rect class="fig" x="-48" y="-52" width="18" height="62" rx="9"/>
    <rect class="fig" x="-25" y="-66" width="18" height="76" rx="9"/>
    <rect class="fig" x="-2" y="-70" width="18" height="80" rx="9"/>
    <rect class="fig" x="21" y="-60" width="18" height="70" rx="9"/>
  </g>
  <text class="k" x="52" y="132">PROTEÍNA</text>
  <text class="t" x="52" y="302">1 palma</text>
  <text class="s" x="52" y="328">Carne, pollo, pescado, huevos</text>

  <!-- Puño -->
  <rect class="card" x="328" y="104" width="280" height="240" rx="14"/>
  <g transform="translate(468,196)">
    <rect class="fig" x="-52" y="-30" width="104" height="84" rx="26"/>
    <path class="ln" d="M-26 -30 V-6 M0 -30 V-4 M26 -30 V-6"/>
  </g>
  <text class="k" x="348" y="132">VERDURAS</text>
  <text class="t" x="348" y="302">1 puño</text>
  <text class="s" x="348" y="328">Verduras y frutas</text>

  <!-- Mano ahuecada -->
  <rect class="card" x="32" y="360" width="280" height="240" rx="14"/>
  <g transform="translate(172,450)">
    <path class="fig" d="M-62 -14 H62 A62 62 0 0 1 -62 -14 Z"/>
    <rect class="fig" x="-62" y="-26" width="124" height="14" rx="7"/>
  </g>
  <text class="k" x="52" y="388">CARBOHIDRATOS</text>
  <text class="t" x="52" y="558">1 mano ahuecada</text>
  <text class="s" x="52" y="584">Arroz, pasta, papa, pan, avena</text>

  <!-- Pulgar -->
  <rect class="card" x="328" y="360" width="280" height="240" rx="14"/>
  <g transform="translate(468,440)">
    <rect class="fig" x="-24" y="-56" width="48" height="112" rx="24"/>
    <path class="ln" d="M-12 -30 Q0 -40 12 -30"/>
  </g>
  <text class="k" x="348" y="388">GRASAS</text>
  <text class="t" x="348" y="558">1 pulgar</text>
  <text class="s" x="348" y="584">Aceite, palta, maní, nueces</text>

  <text class="s" x="32" y="640">Son medidas aproximadas, no exactas. Sirven para empezar</text>
  <text class="s" x="32" y="664">y las ajustamos con tu peso y cómo te sentís.</text>
</svg>
